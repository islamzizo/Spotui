name: Migrate Spotui to Monochrome

on:
  push:
    branches: [monochrome-backend]
    paths:
      - 'tools/migrate_monochrome.py'
      - '.github/workflows/migrate-monochrome.yml'

permissions:
  contents: write

jobs:
  migrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: monochrome-backend
      - name: Run migration
        run: python3 tools/migrate_monochrome.py
      - name: Build
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Gradle build
        run: ./gradlew :app:assembleDebug --stacktrace
      - name: Commit migration
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Replace third-party playback with Monochrome and add MediaStore search' || exit 0
          git push origin monochrome-backend
